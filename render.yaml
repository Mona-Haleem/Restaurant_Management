# Tablz API on Render (B1201, ADR 0027). Two services, one per Supabase project.
# Render never deploys by itself (autoDeployTrigger off): the GitHub workflows call each service's
# deploy hook for an exact commit, staging after CI passes on main, production only by hand.
# Values marked `sync: false` are typed into the Render dashboard once; never commit them.
services:
  - type: web
    name: tablz-api-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: NODE_VERSION
        value: "24"
      # Supabase tablz-staging: transaction pooler (:6543) for the app.
      - key: DATABASE_URL
        sync: false
      # Supabase tablz-staging: session pooler (:5432); the app checks it, migrations use it (B1202).
      - key: DIRECT_URL
        sync: false
      # The staging frontend plus the Vercel preview pattern (docs/ENVIRONMENTS.md).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: tablz-api-production
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Supabase tablz-prod: transaction pooler (:6543).
      - key: DATABASE_URL
        sync: false
      # Supabase tablz-prod: session pooler (:5432).
      - key: DIRECT_URL
        sync: false
      # The production frontend only.
      - key: CORS_ORIGINS
        sync: false

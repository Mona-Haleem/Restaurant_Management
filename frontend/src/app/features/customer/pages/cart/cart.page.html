<app-section-card title="Order Items" subtitle="your selections">
  @for (item of cartItems(); track item._id) {
    <app-order-summery-item [item]="item" data-testid="cart-item" />
  } @empty {
    <p class="empty-cart" data-testid="empty-cart">Your cart is empty.</p>
  }
</app-section-card>
@if (count()) {
  <app-order-summary data-testid="order-summary" />
}

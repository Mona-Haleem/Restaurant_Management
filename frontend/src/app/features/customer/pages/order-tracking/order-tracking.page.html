@if(order) {
<div class="container" >
    <header>
        <h1>Track Order</h1>
        <p class="order-id">Order ID: #{{ order._id.split('-')[0] | uppercase }}</p>
    </header>

    <div class="tracking-layout">
        
        <section class="main-content">
            <app-order-tracker-card [order]="order" />
            
            <app-section-card title="Order Items" subtitle="Items in this order">
                @for(item of order.items; track item._id) {
                    <app-order-summery-item [item]="item" view="readonly" />
                }
            </app-section-card>
        </section>
        <aside class="side-content">
            <app-eta-status />
            
            <app-section-card title="Delivery Info" subtitle="Where we are sending this">
                <div class="info-row">
                    <label>TYPE</label>
                    <span>{{ order.type | uppercase }}</span>
                </div>
                <div class="info-row">
                    <label>LOCATION</label>
                    <span>{{ order.location }}</span>
                </div>
            </app-section-card>
        </aside>
    </div>
</div>
}@else{
        
    
    

    <div class="not-found-container">
        <h2>Order Not Found</h2>
        <p>We couldn't find the order you're looking for. Please check the ID or try again.</p>
        <button class="btn-primary" routerLink="/customer/menu">BACK TO MENU</button>
    </div>

}

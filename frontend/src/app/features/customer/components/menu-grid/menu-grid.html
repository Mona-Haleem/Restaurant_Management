
@if (items | async; as itemsList) {
  @if (itemsList.length > 0) {
    <div class="container">
        @for (item of itemsList; track item._id) {
            <app-menu-card [item]="item" />
        }    
    </div>
    } @else {
        <div class="empty-grid" >
            <p data-testid="empty-grid-msg">No items found</p>
        </div>
    }
}

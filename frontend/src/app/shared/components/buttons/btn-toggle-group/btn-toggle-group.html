@for (option of options(); track option.text) {
  <button
    type="button"
    class="btn-primary"
    [class.option]="option.text !== selected()"
    [attr.aria-pressed]="option.text === selected()"
    (click)="handleClick(option.text)"
  >
    @if (option.icon) {
      <mat-icon class="icon" fontSet="material-symbols-outlined" aria-hidden="true">{{
        option.icon
      }}</mat-icon>
    }
    {{ option.text }}
  </button>
}

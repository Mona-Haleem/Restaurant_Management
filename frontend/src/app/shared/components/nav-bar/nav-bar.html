<header>
    <nav>
        <a id="logo" routerLink="/" data-testid="brand-logo">
            <mat-icon fontSet="material-symbols-outlined">restaurant</mat-icon>
            <h2>Resto</h2>
        </a>
        <a [routerLink]="['customer','menu']" routerLinkActive="selected" data-testid="nav-menu">Menu</a>
        <a [routerLink]="['customer','order']" routerLinkActive="selected" data-testid="nav-orders">Order</a>
    </nav>
    <div id="actions">
        <app-search-bar />
        <a class="relative" [routerLink]="['customer','cart']" routerLinkActive="selected" data-testid="nav-cart">
            <mat-icon fontSet="material-symbols-outlined">shopping_cart</mat-icon>
            @if(count | async ;as c){
            <span class="badge" data-testid="cart-badge">
                {{c}}
            </span>
            }
        </a>
        <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>
        <mat-icon fontSet="material-symbols-outlined">notifications</mat-icon>
        <mat-icon fontSet="material-symbols-outlined" [routerLink]="['customer','profile']">account_circle</mat-icon>
    </div>
</header>

<div id="routes">
  <img [src]="logoImg()" [alt]="'navigation.logoAlt' | transloco" id="logo" />
  @if (!isMobile()) {
    <nav app-nav [links]="navLinks"></nav>
  }
</div>

@if (isMobile()) {
  <app-dropdown-menu
    [items]="mobileActions()"
    triggerType="avatar"
    avatarText="M"
    placement="bottom-end"
    (itemClick)="handleClick($event)"
  >
  </app-dropdown-menu>
} @else {
  <div id="actions" role="toolbar" [attr.aria-label]="'navigation.actions' | transloco">
    @for (item of actions(); track item.id) {
      <button
        type="button"
        class="btn-text-primary icon"
        [id]="'header-action-' + item.id"
        [attr.aria-label]="getActionAriaLabel(item)"
        (click)="handleClick(item)"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</mat-icon>
        @if (item.id === 'cart' && count()) {
          <span class="badge" aria-hidden="true">
            {{ count() > 9 ? '9+' : count() }}
          </span>
          <span class="sr-only">{{ 'navigation.cartBadge' | transloco: { count: count() } }}</span>
        }
      </button>
    }
  </div>
}

@for (link of links(); track link.label) {
  <a
    id="{{ link.label }}"
    [routerLink]="link.route"
    [class.active]="isActive(link.route)"
    [attr.aria-current]="isActive(link.route) ? 'page' : null"
    [attr.aria-label]="'navigation.' + link.label | transloco"
  >
    @if (link.icon) {
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{ link.icon }}</mat-icon>
    }
    <span class="text-caption">
      {{ 'navigation.' + link.label | transloco }}
    </span>
  </a>
}

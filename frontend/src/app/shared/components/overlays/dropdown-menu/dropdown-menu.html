<button
  type="button"
  class="dropdown-trigger"
  [class.trigger-dots]="triggerType() === 'dots'"
  [class.trigger-avatar]="triggerType() === 'avatar'"
  [attr.aria-haspopup]="'menu'"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="triggerType() === 'dots' ? 'Row actions' : 'Account menu'"
  (click)="toggle()"
>
  @if (triggerType() === 'dots') {
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">more_vert</mat-icon>
  } @else {
    <span
      class="avatar-initials"
      [style.background-color]="avatarColor() || null"
      aria-hidden="true"
      >{{ avatarText() }}</span
    >
  }
</button>

@if (isOpen()) {
  <div
    class="dropdown-panel"
    [class.panel-end]="placement() === 'bottom-end'"
    [class.panel-start]="placement() === 'bottom-start'"
    role="menu"
    aria-orientation="vertical"
  >
    <!-- (click)="$event.stopPropagation()" tabindex="1"> -->
    @for (item of items(); track item.id) {
      @if (item.divider) {
        <div class="dropdown-divider" role="separator" aria-hidden="true"></div>
      }
      <button
        type="button"
        class="dropdown-item"
        [class.item-danger]="item.danger"
        [class.item-disabled]="item.disabled"
        [disabled]="item.disabled || null"
        role="menuitem"
        [attr.aria-disabled]="item.disabled || null"
        (click)="select(item)"
      >
        @if (item.icon) {
          <mat-icon class="item-icon" fontSet="material-symbols-outlined" aria-hidden="true">{{
            item.icon
          }}</mat-icon>
        }
        <span class="item-label">{{ item.label }}</span>
      </button>
    }
  </div>
}

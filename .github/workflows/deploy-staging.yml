name: Deploy staging

# B1201 (ADR 0028): a merge to main reaches the Vercel project tablz-api-staging with no manual step,
# but only after CI has passed for that exact commit. B1202 adds `migrate deploy` before the build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A successful CI run on a push to main (a merge), never a pull request run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      API_URL: ${{ vars.STAGING_API_URL }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Skip until the project is configured, or if a newer commit is on main
        id: ready
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$API_URL" ]; then
            echo "::notice::The staging Vercel secrets or STAGING_API_URL are not set yet: nothing deployed (see backend/docs/adr/0028-vercel-deployment.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/${REPO}/commits/main" --jq .sha)" != "$COMMIT" ]; then
            # CI runs can finish out of order: never deploy an older commit over a newer one.
            echo "::notice::${COMMIT} is no longer the tip of main: the newer commit's run deploys instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: ${{ env.COMMIT }}
          # vercel build runs npm scripts: leave no GitHub token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      - name: Build this commit with Vercel
        if: steps.ready.outputs.ready == 'true'
        # From the repo root: the Vercel project's Root Directory setting is `backend`.
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy it
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        run: npx --yes vercel@65.2.0 deploy --prebuilt --prod --env DEPLOY_COMMIT="${COMMIT}" --token="$VERCEL_TOKEN"

      - name: Wait until /v1/health reports this commit
        if: steps.ready.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 40); do
            running=$(curl -fsS --max-time 5 "${API_URL}/v1/health" | jq -r '.commit // empty' || true)
            if [ "$running" = "$COMMIT" ]; then
              echo "Staging runs ${COMMIT}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Staging did not report ${COMMIT} on /v1/health within about 13 minutes; rolling back to the previous deployment."
          exit 1

      - name: Roll back to the previous deployment
        # vercel deploy --prod makes the deployment live once it builds; Vercel never checks that it
        # boots. If it never reports this commit, put the previous deployment back (Hobby allows it).
        if: failure() && steps.deploy.outcome == 'success'
        run: npx --yes vercel@65.2.0 rollback --token="$VERCEL_TOKEN"
